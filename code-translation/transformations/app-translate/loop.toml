# Task of app-translate for code-translation's loop (dev/tools/loop.py): dev/bin/loop app-translate.

[tools]
bash = ["readiness", "oracle", "build", "rm", "cat", "diff"]
protect = [
  "transformations/app-translate/desired_spec.md",
  "transformations/app-translate/current_plan.md",
  "transformations/app-translate/approvals.toml",
  "app/tests/*",
  "app/Makefile",
  "dev/**/*",
]
writable = ["transformations/app-translate/agent_log.md"]

[check]
command = "python dev/bin/oracle"
timeout = 300

[[chat.user]]
content = '''
Work on the transformation in transformations/app-translate/ from code-translation/: read
current_plan.md, then desired_spec.md, agent_log.md and approvals.toml. Do one author
session of the Plan: settle one unit, or fix what the review reports.

The Spec, Plan and approvals are human-owned and protected; agent_log.md is the only file of
that folder you may write. On conflict the Spec governs. Commands (they run in the container):
`oracle`, `readiness`, `build`. One plain command per bash call.
'''

# Models for the access you bring. "${NAME}" reads the environment; "!cmd" runs a command (not pi:).
#
#   harness   with                             agent     loop (code-translation)   search (mxp-optimization)
#   pi        an API key or OpenRouter         openai:   openai:                   openai:
#   claude    a Claude subscription            claude:   -                         Claude Code CLI
#   codex     a ChatGPT (Codex) subscription   codex:    -                         Codex CLI
#
# Subscriptions have no API access: mxp-optimization only. Rerun tools/setup after editing.

harness: claude

openai:
  base_url: "https://inference-api.alcf.anl.gov/resource_server/minerva/api/v1"
  api_key: "<your-key-here>"
  provider: "alcf"

pi:
  model: "mistral-large-4-nvfp4"
  reasoning: false
  context_window: 272000
  max_tokens: 16384
  supports_developer_role: false
  supports_reasoning_effort: false

loop:
  model: ""

evolve:
  model: ""
  max_tokens: 16000
  timeout: 300

claude:                        # your `claude` login
  model: "mistral-large-4-nvfp4"
  key: "<your-key-here>" # the search's: an API key, or an OAuth token (`claude setup-token`)


codex:                         # your `codex login`
  model: "gpt-6.1-sol"
  reasoning_effort: ""         # low | medium | high

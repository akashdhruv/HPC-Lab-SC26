# The model endpoint of the harnesses: any OpenAI-compatible API. The orchestrators (Claude
# Code, Codex, pi, ...) bring their own model configuration; setup links only their skills and
# adapter settings, never their model settings.
#
# pi:     the model of pi sessions (both systems).
# loop:   the model of the CodeScribe loop (code-translation), like evolve its own section; a
#         key not set here falls back to pi: (loop.model defaults to pi.model, likewise
#         reasoning, max_tokens and nloop).
# evolve: the model OpenEvolve samples candidates from (mxp-optimization). provider: "auto"
#         — the orchestrator of the session that starts the search: claude -> "claude_code",
#         codex -> "codex_app_server" (both run that CLI headless; the container mounts the
#         host's ~/.claude / ~/.codex, so `claude login` / `codex login` once on the host is
#         enough), pi or anything else -> "openai", the endpoint above. Set openai /
#         claude_code / codex_app_server to pin one. model: under "openai", evolve.model else
#         pi.model; under a CLI backend, evolve.model (assumed available through the user's CLI
#         login), else the CLI's own alias (per-run: openevolve: model). budget: a per-call cap
#         for the CLI backends, e.g. "$5".
# A value may read an environment variable: "${NAME}".

OPENAI_COMP_BASEURL: "https://inference-api.alcf.anl.gov/resource_server/tara/api/v1"
OPENAI_COMP_APIKEY: "!alcf-tokens get-token inference"
OPENAI_COMP_PROVIDER: "alcf"

pi:
  model: "nemotron-35-super-vl"
  reasoning: false
  context_window: 272000
  max_tokens: 16384
  supports_developer_role: false
  supports_reasoning_effort: false

loop:
  model: "beam-1.0-bf8"
  nloop: "5"

evolve:
  model: "beam-1.0-bf8"
  provider: "auto"
  max_tokens: 16000
  timeout: 300
  budget: "$5"
